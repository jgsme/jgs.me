name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-format:
    name: Check Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # バージョンは package.json の packageManager から解決する。
      # ここで version を併記すると action-setup v6 は二重指定でエラーになる。
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Format
        run: pnpm format:check

      - name: Lint Tokens
        run: pnpm lint:tokens

  test-og:
    name: Test OG
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # OG 画像の生成を workerd 上で回す。satori / resvg の更新 PR (Renovate の
      # og-image グループ) が本番で壊れるかをここで止める
      - name: Test
        run: pnpm --filter og test
